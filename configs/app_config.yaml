app:
  name: "Nỗi Sợ AudioBook - Hệ Thống Dựng Video Trinh Thám & Kinh Dị Gothic"
  version: "20.0.0"
  engine: "Cinema Gothic V20 - Subtitle-Locked Scene Sync & All-in-One Gemini 3.8 Flash"
  description: "Automated Cinematic Audiobook, Gothic Horror & Detective Video Production System"

hardware:
  device: "cuda"
  preferred_gpu: "T4"
  precision: "fp16"

paths:
  outputs_dir: "outputs"
  temp_dir: "temp_work"
  fonts_dir: "fonts"
  default_font: "fonts/BeVietnamPro-Bold.ttf"

ai_director:
  default_model: "gemini-3.5-flash-lite"
  supported_models:
    - "gemini-3.5-flash-lite"
    - "gemini-3.8-flash"
    - "gemini-3.5-flash"
    - "gemini-3.1-flash-lite"
    - "gemini-3.7-flash"
    - "gemini-3.6-flash"
    - "gemini-3-flash-preview"
  chunk_size: 45
  exponential_backoff:
    max_retries: 3
    delays: [3.0, 6.0, 10.0]

video:
  fps: 24
  resolutions:
    "16:9": [1920, 1080]
    "9:16": [1080, 1920]
  defaults:
    aspect_ratio: "16:9"
    visual_mode: "🎨 100% Ảnh Nghệ Thuật AI (SDXL Photorealism)"
    sync_mode: "⚡ Tự động theo từng câu Subtitle (Whisper Sync)"
    title_font_size: 60
    sub_font_size: 18
    title_style: "✨ Điện Ảnh Sang Trọng (Chữ Trắng Đổ Bóng - Không Hộp Đen)"
    sub_color: "Vàng viền đen (Nổi bật - Khuyên dùng)"
    waveform_style: "Tắt"
    retention_cuts: true
    bgm_volume: 0.10

safe_zones:
  vertical:
    title_y: 140
    sub_margin_v_normal: 38
    sub_margin_v_wave: 52
    wave_overlay_y: "H-h-240"
  horizontal:
    title_y: 50
    sub_margin_v_normal: 24
    sub_margin_v_wave: 34
    wave_overlay_y: "H-h-25"

thumbnail:
  width: 1280
  height: 720
  font_color: "0xFFE600"
  border_color: "black"
  border_width: 9
  shadow_offset: 6

tts:
  model_id: "pnnbao-ump/VieNeu-TTS-v3-Turbo"
  default_voice: "Thiền Tâm Đức"

youtube:
  privacy_status: "private"
  default_tags: "trinh thám, kinh dị gothic, edgar allan poe, sherlock holmes, noi so audiobook, sach noi kinh di, vu an bi an, truyen trinh tham kinh dien"
  shared_drive_folder_id: "1GCWzDry94uvLRZM5B97Alddfrm9uvjQH"
